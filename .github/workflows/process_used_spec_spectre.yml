# Modify used_spec or used_spectre flags

name: Process PR comment to modify used_spec or used_spectre flags

on:
  issue_comment:
    types: [created]

jobs:
  process-PR-comment:

    # Only run on upstream, not on each fork
    if: |
      github.repository_owner == 'sxs-collaboration'
      && github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/used-spec')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Checkout PR branch
      # Refuse PRs from forks: we are about to run the PR branch's scripts
      # with a write token.
      run: |
        if [[ "$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)" != "false" ]]; then
          echo "Refusing to run on a PR from a fork."
          exit 1
        fi
        gh pr checkout "$PR_NUMBER"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.issue.number }}
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sxs pyyaml
    - name: Name myself for git commits
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    - name: Run processUsedSpecSpectre.py
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        cd _papers
        # Never interpolate the comment into the script itself; read it from
        # the environment and only use the first line.
        COMMENT_BODY="${COMMENT_BODY//$'\r'/}"
        read -ra WORDS <<< "$COMMENT_BODY"
        CMD="${WORDS[0]}"
        BIBS=("${WORDS[@]:1}")
        if [[ ${#BIBS[@]} -eq 0 ]]; then
          echo "No bibkeys given."
          exit 1
        fi

        case "$CMD" in
          /used-spec-true)     ARGS=(--spec --used) ;;
          /used-spec-false)    ARGS=(--spec --no-used) ;;
          /used-spectre-true)  ARGS=(--spectre --used) ;;
          /used-spectre-false) ARGS=(--spectre --no-used) ;;
          *)
            echo "Unrecognized slash command: $CMD"
            exit 1
            ;;
        esac

        python processUsedSpecSpectre.py "${ARGS[@]}" -- "${BIBS[@]}"
    - name: Commit and push changes
      run: |
        git commit -a -m "Modifying used_spec(tre) in PR comment" || echo "No changes to commit"
        git push
