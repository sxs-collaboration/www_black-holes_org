{%- if page.previous or page.next -%}
<nav class="pagination is-centered" role="navigation" aria-label="pagination">
    {%- if page.previous -%}
    <a href="{{ site.baseurl }}{{ page.previous.url }}" class="pagination-previous" aria-label="Previous page" title="{{ page.previous.title | markdownify | strip_html }}">Previous page</a>
    {%- else -%}
    <a href="#" class="pagination-previous" aria-label="Previous page" disabled>Previous page</a>
    {%- endif -%}
    {%- if page.next -%}
    <a href="{{ site.baseurl }}{{ page.next.url }}" class="pagination-next" aria-label="Next page" title="{{ page.next.title | markdownify | strip_html }}">Next page</a>
    {%- else -%}
    <a href="#" class="pagination-next" aria-label="Next page" disabled>Next page</a>
    {%- endif -%}
</nav>
{%- endif -%}
